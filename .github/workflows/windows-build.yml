name: Windows build and tests

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Automated tests (synthetic data, no email is sent)
        run: python -m pytest -q
      - name: Build packaged executable
        run: |
          python -m pip install -r requirements-build.txt
          pyinstaller --noconfirm --clean packaging\relay_hub.spec
          copy scripts\windows\create_desktop_shortcut.bat dist\RelayEmployeeHub\
          copy scripts\windows\install_logon_startup.bat dist\RelayEmployeeHub\
          copy scripts\windows\remove_logon_startup.bat dist\RelayEmployeeHub\
          copy docs\OPERATOR_GUIDE.md dist\RelayEmployeeHub\
          copy THIRD_PARTY_NOTICES.md dist\RelayEmployeeHub\
        shell: cmd
      - name: Smoke-test the packaged executable offline data folder
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "hub-smoke-data"
          $p = Start-Process -FilePath "dist\RelayEmployeeHub\RelayEmployeeHub.exe" -ArgumentList "--data-dir `"$data`" --no-browser --port 8799" -PassThru
          python scripts\smoke_test_server.py http://127.0.0.1:8799
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          exit $code
      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path dist\RelayEmployeeHub -DestinationPath dist\RelayEmployeeHub-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RelayEmployeeHub-windows
          path: dist/RelayEmployeeHub-windows.zip
          retention-days: 30
